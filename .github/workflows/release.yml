name: Release firmware

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reject embedded credentials
        run: test ! -f main/config.h

      - name: Set firmware version
        run: printf '%s\n' "${GITHUB_REF_NAME}" > version.txt

      - name: Build firmware
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.2
          target: esp32c3
          path: .

      - name: Publish release asset
        uses: softprops/action-gh-release@v2
        with:
          files: build/beescale.bin
          generate_release_notes: true
